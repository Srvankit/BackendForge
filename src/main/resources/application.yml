spring:
  application:
    name: backendforge

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backendforge}
    username: ${DB_USERNAME:backendforge}
    password: ${DB_PASSWORD:backendforge}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
